spring.application.name=customer-service
server.port=8080
spring.data.mongodb.host=${MONGO_HOST:localhost}
spring.data.mongodb.port=${MONGO_PORT:27017}
spring.data.mongodb.database=${MONGO_DATABASE:customer}
spring.data.mongodb.username=${MONGO_USER}
spring.data.mongodb.password=${MONGO_PASSWORD}
spring.data.mongodb.authentication-database=admin
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
server.error.include-message=never
server.error.include-stacktrace=never
customer.url=${CUSTOMER_URL:http://customer-service:8080}
product.url=${PRODUCT_URL:http://product-service:8080}
inventory.url=${INVENTORY_URL:http://inventory-service:8080}
sales.url=${SALES_URL:http://sales-service:8080}
logging.pattern.level=%5p [requestId=%X{requestId}]
